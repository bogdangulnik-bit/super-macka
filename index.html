<!DOCTYPE html>
<html lang="hr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Super Macka</title><link rel="manifest" href="manifest.json">
<style>*{margin:0;padding:0;box-sizing:border-box}body{overflow:hidden;font-family:Arial;background:#87CEEB}
#game{width:100vw;height:100vh;position:relative;overflow:hidden;background:linear-gradient(#87CEEB 0%,#B0E0E6 55%,#7ED957 55%,#228B22 100%)}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:20;color:#fff;font-weight:bold;font-size:22px;text-shadow:2px 2px 0 #000}
#player{position:absolute;left:50px;top:400px;width:50px;height:50px;font-size:46px;z-index:10}
.tile{position:absolute;background:#8B4513;border-top:6px solid #228B22;border-radius:4px;z-index:2}
.coin{position:absolute;font-size:28px;z-index:3}
.enemy{position:absolute;font-size:40px;z-index:4}
#controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 15px;z-index:30}
.btn{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.9);border:3px solid #333;font-size:30px;display:flex;align-items:center;justify-content:center}
#jumpBtn{width:85px;height:85px;background:#FF6B6B}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);color:#fff;padding:25px;border-radius:20px;text-align:center;z-index:40;display:none}
#msg button{padding:12px 25px;font-size:20px;background:#FFD700;border:none;border-radius:10px;margin-top:15px;font-weight:bold}
</style></head>
<body><div id="game">
<div id="hud"><span>🪙 <span id="coins">0</span></span><span>❤️ <span id="lives">3</span></span><span>🏁 Level 1</span></div>
<div id="player">🐱</div>
<div id="controls"><div style="display:flex;gap:10px"><div class="btn" id="leftBtn">⬅️</div><div class="btn" id="rightBtn">➡️</div></div><div class="btn" id="jumpBtn">⬆️</div></div>
<div id="msg"><h1 id="msgTitle">🎉 POBIJEDIO SI!</h1><p id="msgText"></p><button onclick="location.reload()">IGRAJ OPET</button></div>
</div>
<script>
let px=50,py=400,vx=0,vy=0,onGround=false,coins=0,lives=3,dead=false,camX=0;
let keys={};
let plats=[{x:0,y:550,w:900,h:100},{x:950,y:550,w:700,h:100},{x:1700,y:550,w:700,h:100},{x:2450,y:550,w:800,h:100},{x:3300,y:550,w:700,h:100},{x:400,y:430,w:140,h:30},{x:700,y:340,w:140,h:30},{x:1150,y:430,w:140,h:30},{x:1450,y:340,w:140,h:30},{x:1900,y:430,w:140,h:30},{x:2200,y:340,w:140,h:30},{x:2650,y:430,w:140,h:30},{x:2950,y:340,w:140,h:30}];
let coinPos=[{x:430,y:390},{x:730,y:300},{x:1180,y:390},{x:1480,y:300},{x:1930,y:390},{x:2230,y:300},{x:2680,y:390},{x:2980,y:300},{x:1100,y:500},{x:1800,y:500},{x:2800,y:500}];
let enemies=[{x:600,y:505,d:1,s:600,r:200},{x:1300,y:505,d:-1,s:1300,r:150},{x:2000,y:505,d:1,s:2000,r:180},{x:2800,y:505,d:-1,s:2800,r:200}];
let layer=document.getElementById('game');
plats.forEach(p=>{let d=document.createElement('div');d.className='tile';d.id='t'+p.x;layer.appendChild(d);});
coinPos.forEach((c,i)=>{let d=document.createElement('div');d.className='coin';d.id='c'+i;d.textContent='🪙';layer.appendChild(d);});
enemies.forEach((e,i)=>{let d=document.createElement('div');d.className='enemy';d.id='e'+i;d.textContent='🐶';layer.appendChild(d);});
let goal=document.createElement('div');goal.textContent='🏁';goal.style.cssText='position:absolute;font-size:60px;z-index:4';layer.appendChild(goal);
function snd(f){try{let a=new (window.AudioContext||window.webkitAudioContext)();let o=a.createOscillator();o.frequency.value=f;o.connect(a.destination);o.start();o.stop(a.currentTime+0.15);}catch(e){}}
function lose(){lives--;document.getElementById('lives').textContent=lives;snd(200);if(lives<=0){document.getElementById('msgTitle').textContent='💀 GAME OVER';document.getElementById('msgText').textContent='Psi su te uhvatili! Novcici: '+coins;document.getElementById('msg').style.display='block';dead=true;}else{px=50;py=400;vx=0;vy=0;camX=0;}}
function loop(){
if(dead)return;
if(keys.left)vx=-5;else if(keys.right)vx=5;else vx=0;
vy+=0.7;if(vy>12)vy=12;
if(keys.jump&&onGround){vy=-13;onGround=false;snd(600);}
px+=vx;py+=vy;if(px<0)px=0;if(px>3950)px=3950;
onGround=false;
for(let p of plats){if(px+40>p.x&&px<p.x+p.w&&py+48>p.y&&py+48<p.y+22&&vy>=0){py=p.y-48;vy=0;onGround=true;}}
if(py>650){lose();requestAnimationFrame(loop);return;}
camX=px-150;if(camX<0)camX=0;if(camX>3200)camX=3200;
for(let p of plats){let d=document.getElementById('t'+p.x);d.style.left=(p.x-camX)+'px';d.style.top=p.y+'px';d.style.width=p.w+'px';d.style.height=p.h+'px';}
coinPos.forEach((c,i)=>{let d=document.getElementById('c'+i);if(c.taken){d.style.display='none';return;}d.style.left=(c.x-camX)+'px';d.style.top=c.y+'px';if(Math.abs(px-c.x)<35&&Math.abs(py-c.y)<40){c.taken=true;coins++;document.getElementById('coins').textContent=coins;snd(900);}});
enemies.forEach((e,i)=>{e.x+=e.d*1.5;if(e.x>e.s+e.r)e.d=-1;if(e.x<e.s-e.r)e.d=1;let d=document.getElementById('e'+i);d.style.left=(e.x-camX)+'px';d.style.top=e.y+'px';if(Math.abs(px-e.x)<35&&Math.abs(py-e.y)<35){if(vy>0&&py<e.y){e.x=-9999;snd(400);coins+=2;document.getElementById('coins').textContent=coins;}else lose();}});
goal.style.left=(3850-camX)+'px';goal.style.top='480px';
if(px>3800){document.getElementById('msgTitle').textContent='🎉 POBIJEDIO SI!';document.getElementById('msgText').textContent='Macka je stigla! Novcici: '+coins;document.getElementById('msg').style.display='block';dead=true;snd(1000);}
let pl=document.getElementById('player');pl.style.left=(px-camX)+'px';pl.style.top=py+'px';
requestAnimationFrame(loop);
}
function bind(id,k){let el=document.getElementById(id);el.addEventListener('touchstart',e=>{e.preventDefault();keys[k]=true;});el.addEventListener('touchend',e=>{e.preventDefault();keys[k]=false;});el.addEventListener('mousedown',()=>keys[k]=true);el.addEventListener('mouseup',()=>keys[k]=false);}
bind('leftBtn','left');bind('rightBtn','right');bind('jumpBtn','jump');
loop();
</script></body></html>
